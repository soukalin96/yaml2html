<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAML to Table Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BuildReport</h1>
            <p>Table</p>
        </div>

        <div class="input-section">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" class="file-input" accept=".yaml,.yml" />
                <label for="fileInput" class="file-input-button">Choose YAML File</label>
            </div>
            
            <div id="file-status" class="file-status"></div>
        </div>

        <div class="table-container">
            <div id="output"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
