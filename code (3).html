<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAML Data Visualizer</title>
    <style>
        :root {
            --header-bg: #2c3e50;
            --header-text: #ecf0f1;
            --row-alt: #f8f9fa;
            --pass-color: #2ecc71;
            --fail-color: #e74c3c;
            --border-color: #dee2e6;
            --expand-btn: #3498db;
            --hover-color: #f1f1f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 100%;
            overflow-x: auto;
        }

        h1 {
            color: var(--header-bg);
            margin-bottom: 20px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-input-container {
            position: relative;
            flex-grow: 1;
        }

        .file-status {
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
        }

        .file-status.success {
            background-color: rgba(46, 204, 113, 0.1);
            color: var(--pass-color);
        }

        .file-status.error {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--fail-color);
        }

        button {
            padding: 8px 15px;
            background-color: var(--expand-btn);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .empty-state {
            padding: 20px;
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }

        .main-title {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 12px 15px;
            margin: 25px 0 10px 0;
            border-radius: 4px;
            font-size: 1.2em;
        }

        table.yaml-table {
            width: auto;
            border-collapse: collapse;
            margin: 0;
            table-layout: fixed;
            min-width: 100%;
        }

        table.yaml-table th {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 12px 8px;
            text-align: center;
            position: sticky;
            top: 0;
            box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1);
            white-space: normal;
            word-break: break-word;
        }

        table.yaml-table td {
            padding: 8px;
            border: 1px solid var(--border-color);
            vertical-align: top;
            white-space: normal;
            word-break: break-word;
        }

        table.yaml-table tr:nth-child(even) {
            background-color: var(--row-alt);
        }

        table.yaml-table tr:hover {
            background-color: var(--hover-color);
        }

        .level2-header {
            text-align: center;
            font-weight: bold;
        }

        .pass-fail-cell {
            text-align: center;
            min-width: 80px;
            width: 80px;
        }

        .pass-fail-display {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .pass-value {
            color: var(--pass-color);
            font-weight: bold;
            flex: 1;
        }

        .fail-value {
            color: var(--fail-color);
            font-weight: bold;
            flex: 1;
        }

        .expand-btn {
            background: none;
            border: none;
            color: var(--expand-btn);
            cursor: pointer;
            padding: 0;
            margin-right: 5px;
            font-size: 10px;
            width: 15px;
            height: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .expand-btn:hover {
            background: none;
        }

        .expand-btn.expanded {
            transform: rotate(90deg);
        }

        .hidden-row {
            display: none;
        }

        .md-cell {
            display: block;
            background-color: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
            word-break: break-all;
            max-width: 300px;
            overflow-x: auto;
        }

        .total-row {
            font-weight: bold;
            color: #d9534f;
            background-color: #ffcccc; /* Light red background */
        }

        .filtered-out {
            display: none !important;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #fileInput {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* Fixed column widths */
        .fixed-first-col {
            width: 250px;
            min-width: 250px;
            max-width: 250px;
            color: inherit;
        }

        .fixed-sub-col {
            width: 200px;
            min-width: 200px;
            max-width: 200px;
        }

        /* .fixed-md-col {
            width: 300px;
            min-width: 300px;
            max-width: 300px;
        } */
        .expandable-row {
            font-weight: bold;
            color: #1a6fb3;
            /* background-color: lightblue;  */
        }
        /* .sub-row {
            background-color: #1a6fb3;
        } */

        .search-container {
            flex-grow: 1;
            max-width: 300px; /* Adjust as needed */
        }

        #searchInput, #searchSubRowInput {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't increase total width */
        }
    </style>
</head>
<body>
    <h1>YAML Data Visualizer</h1>
    
    <div class="controls">
        <div class="file-input-container">
            <input type="file" id="fileInput" accept=".yaml,.yml">
            <div id="file-status"></div>
        </div>
        
        <button id="expandAllBtn">Expand All</button>
        <button id="collapseAllBtn">Collapse All</button>
        
        <div class="checkbox-container">
            <input type="checkbox" id="filterZeroFails">
            <label for="filterZeroFails">Hide rows with zero fails</label>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Regression Set (Level 3)...">
        </div>
        
        <!-- NEW SEARCH INPUT FOR LEVEL 4 SUB-ROWS -->
        <div class="search-container">
            <input type="text" id="searchSubRowInput" placeholder="Search Regression (Level 4)...">
        </div>
    </div>
    
    <div class="container">
        <div id="output"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const statusDiv = document.getElementById('file-status');

            if (file) {
                statusDiv.innerHTML = '<div class="file-status">Loading file...</div>';

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const yamlContent = e.target.result;
                        const data = jsyaml.load(yamlContent);

                        statusDiv.innerHTML = `<div class="file-status success">✓ File "${file.name}" loaded successfully</div>`;
                        generateTable(data);
                    } catch (error) {
                        statusDiv.innerHTML = `<div class="file-status error">✗ Error parsing YAML: ${error.message}</div>`;
                        document.getElementById('output').innerHTML = '';
                    }
                };
                reader.onerror = function() {
                    statusDiv.innerHTML = '<div class="file-status error">✗ Error reading file</div>';
                };
                reader.readAsText(file);
            } else {
                statusDiv.innerHTML = '';
                document.getElementById('output').innerHTML = '';
            }
        });

        function showError(message) {
            document.getElementById('output').innerHTML = `<div class="error">${message}</div>`;
        }

        function generateTable(data) {
            const output = document.getElementById('output');

            if (!data || typeof data !== 'object') {
                showError('Invalid data structure');
                return;
            }

            let html = '';

            for (const [level1Key, level1Data] of Object.entries(data)) {
                html += `<h2 class="main-title">${level1Key}</h2>`;

                if (!level1Data || typeof level1Data !== 'object') continue;

                const level2Keys = Object.keys(level1Data);
                if (level2Keys.length === 0) {
                    html += '<div class="empty-state">No data available</div>';
                    continue;
                }

                const level3KeysByLevel2 = {};
                for (const level2Key of level2Keys) {
                    const level2Data = level1Data[level2Key];
                    level3KeysByLevel2[level2Key] = level2Data && typeof level2Data === 'object'
                        ? Object.keys(level2Data) : [];
                }

                const level4Keys = new Set();
                for (const level2Key of level2Keys) {
                    const level2Data = level1Data[level2Key];
                    for (const level3Key of Object.keys(level2Data || {})) {
                        const level3Data = level2Data[level3Key];
                        for (const level4Key of Object.keys(level3Data || {})) {
                            level4Keys.add(level4Key);
                        }
                    }
                }

                const level4Array = Array.from(level4Keys);
                if (level4Array.length === 0) {
                    html += '<div class="empty-state">No structured data available</div>';
                    continue;
                }

                html += '<table class="yaml-table"><thead><tr><th rowspan="2" class="fixed-first-col">Regression</th>';
                level2Keys.forEach(level2Key => {
                    const count = level3KeysByLevel2[level2Key].length;
                    if (count > 0) {
                        html += `<th colspan="${count}" class="level2-header">${level2Key}</th>`;
                    }
                });
                html += '</tr><tr>';
                level2Keys.forEach(level2Key => {
                    level3KeysByLevel2[level2Key].forEach(level3Key => {
                        html += `<th class="fixed-sub-col">${level3Key}</th>`;
                    });
                });
                html += '</tr></thead><tbody>';

                let rowId = 0;

                level4Array.forEach(level4Key => {
                    const mainRowId = `main-${rowId}`;
                    html += `<tr class="expandable-row" id="${mainRowId}">`;
                    html += `<td class="fixed-first-col"><button class="expand-btn" onclick="toggleRow('${mainRowId}')">▶</button> ${level4Key}</td>`;

                    level2Keys.forEach(level2Key => {
                        const level2Data = level1Data[level2Key];
                        level3KeysByLevel2[level2Key].forEach(level3Key => {
                            let totalPass = 0, totalFail = 0, hasData = false;
                            const cellData = level2Data?.[level3Key]?.[level4Key];
                            for (const val of Object.values(cellData || {})) {
                                if (typeof val === 'object' && val !== null) {
                                    if (typeof val.pass === 'number') totalPass += val.pass;
                                    if (typeof val.fail === 'number') totalFail += val.fail;
                                    hasData = true;
                                }
                            }
                            html += '<td class="pass-fail-cell">';
                            html += hasData
                                ? `<div class="pass-fail-display"><span class="pass-value">${totalPass}</span><span class="fail-value">${totalFail}</span></div>`
                                : '-';
                            html += '</td>';
                        });
                    });
                    html += '</tr>';

                    const level5Keys = new Set();
                    for (const level2Key of level2Keys) {
                        const level2Data = level1Data[level2Key];
                        for (const level3Key of Object.keys(level2Data || {})) {
                            const l3 = level2Data[level3Key];
                            if (l3?.[level4Key] && typeof l3[level4Key] === 'object') {
                                Object.keys(l3[level4Key]).forEach(k => level5Keys.add(k));
                            }
                        }
                    }

                    const level5Array = Array.from(level5Keys);
                    const filterFails = document.getElementById('filterZeroFails')?.checked;

                    level5Array.forEach(level5Key => {
                        let totalFails = 0;
                        for (const level2Key of level2Keys) {
                            const level2Data = level1Data[level2Key];
                            for (const level3Key of Object.keys(level2Data || {})) {
                                const val = level2Data?.[level3Key]?.[level4Key]?.[level5Key];
                                if (val && typeof val.fail === 'number') totalFails += val.fail;
                            }
                        }

                        const shouldHide = filterFails && totalFails === 0;
                        const subRowId = `sub-${rowId}-${level5Key.replace(/[^a-zA-Z0-9-_]/g, '-')}`;
                        html += `<tr class="sub-row hidden-row ${shouldHide ? 'filtered-out' : ''}" data-parent="${mainRowId}" id="${subRowId}">`;
                        html += `<td class="fixed-first-col"><button class="expand-btn" onclick="toggleRow('${subRowId}')">▶</button> ${level5Key}</td>`;

                        level2Keys.forEach(level2Key => {
                            const level2Data = level1Data[level2Key];
                            level3KeysByLevel2[level2Key].forEach(level3Key => {
                                const val = level2Data?.[level3Key]?.[level4Key]?.[level5Key];
                                html += '<td class="pass-fail-cell">';
                                if (typeof val === 'object' && val !== null) {
                                    html += `<div class="pass-fail-display"><span class="pass-value">${val.pass ?? '-'}</span><span class="fail-value">${val.fail ?? '-'}</span></div>`;
                                } else {
                                    html += '-';
                                }
                                html += '</td>';
                            });
                        });

                        html += '</tr>';

                        // MD row
                        html += `<tr class="md-row hidden-row ${shouldHide ? 'filtered-out' : ''}" data-parent="${subRowId}"><td class="fixed-first-col">Metadata</td>`;
                        level2Keys.forEach(level2Key => {
                            const level2Data = level1Data[level2Key];
                            level3KeysByLevel2[level2Key].forEach(level3Key => {
                                const val = level2Data?.[level3Key]?.[level4Key]?.[level5Key];
                                html += '<td class="fixed-md-col">';
                                if (val && val.MD) {
                                    if (typeof val.MD === 'object' && val.MD !== null) {
                                        html += `<code class="md-cell">${JSON.stringify(val.MD, null, 2)}</code>`;
                                    } else {
                                        html += `<code class="md-cell">${val.MD}</code>`;
                                    }
                                } else {
                                    html += '-';
                                }
                                html += '</td>';
                            });
                        });
                        html += '</tr>';
                    });

                    rowId++;
                });

                // Total row
                html += '<tr class="total-row"><td class="fixed-first-col"><strong>Total</strong></td>';
                level2Keys.forEach(level2Key => {
                    const level2Data = level1Data[level2Key];
                    level3KeysByLevel2[level2Key].forEach(level3Key => {
                        let totalPass = 0, totalFail = 0;
                        level4Array.forEach(level4Key => {
                            const val = level2Data?.[level3Key]?.[level4Key];
                            for (const v of Object.values(val || {})) {
                                if (typeof v === 'object' && v !== null) {
                                    if (typeof v.pass === 'number') totalPass += v.pass;
                                    if (typeof v.fail === 'number') totalFail += v.fail;
                                }
                            }
                        });
                        html += `<td class="pass-fail-cell"><div class="pass-fail-display"><span class="pass-value">${totalPass}</span><span class="fail-value">${totalFail}</span></div></td>`;
                    });
                });
                html += '</tr>';

                html += '</tbody></table>';
            }

            output.innerHTML = html || '<div class="empty-state">No data to display</div>';
        }

        function toggleRow(rowId) {
            const row = document.getElementById(rowId);
            const expandBtn = row.querySelector('.expand-btn');
            const isExpanded = expandBtn.classList.contains('expanded');

            expandBtn.classList.toggle('expanded');

            const allRows = document.querySelectorAll(`tr[data-parent="${rowId}"]`);
            allRows.forEach(childRow => {
                // Only toggle visibility if the child row is not already hidden by a filter
                const isFilteredOut = childRow.classList.contains('filtered-out') || childRow.style.display === 'none';

                if (isExpanded) {
                    childRow.classList.add('hidden-row');
                    const childExpandBtn = childRow.querySelector('.expand-btn');
                    if (childExpandBtn) {
                        childExpandBtn.classList.remove('expanded');
                        const grandChildren = document.querySelectorAll(`tr[data-parent="${childRow.id}"]`);
                        grandChildren.forEach(gc => gc.classList.add('hidden-row'));
                    }
                } else {
                    // If not expanded, show the row unless it's filtered out
                    if (!isFilteredOut) {
                        childRow.classList.remove('hidden-row');
                    }
                }
            });
        }

        document.getElementById('filterZeroFails')?.addEventListener('change', () => {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const yamlContent = e.target.result;
                        const data = jsyaml.load(yamlContent);
                        generateTable(data);
                        // After regenerating, re-apply current search filters
                        const searchInput = document.getElementById('searchInput');
                        if (searchInput) {
                            const event = new Event('keyup');
                            searchInput.dispatchEvent(event);
                        }
                        const searchSubRowInput = document.getElementById('searchSubRowInput');
                        if (searchSubRowInput) {
                            const event = new Event('keyup');
                            searchSubRowInput.dispatchEvent(event);
                        }
                    } catch (error) {
                        console.error(error);
                    }
                };
                reader.readAsText(fileInput.files[0]);
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const expandAllBtn = document.getElementById("expandAllBtn");
            const collapseAllBtn = document.getElementById("collapseAllBtn");
            const searchInput = document.getElementById('searchInput');
            const searchSubRowInput = document.getElementById('searchSubRowInput'); // Get the new search input

            expandAllBtn?.addEventListener("click", () => {
                document.querySelectorAll(".expandable-row").forEach(row => {
                    const rowId = row.id;
                    const btn = row.querySelector(".expand-btn");
                    if (btn && !btn.classList.contains("expanded")) {
                        toggleRow(rowId);
                    }
                });
            });

            collapseAllBtn?.addEventListener("click", () => {
                document.querySelectorAll(".expandable-row").forEach(row => {
                    const rowId = row.id;
                    const btn = row.querySelector(".expand-btn");
                    if (btn && btn.classList.contains("expanded")) {
                        toggleRow(rowId);
                    }
                });
            });

            searchInput?.addEventListener('keyup', function() {
                const filter = this.value.toLowerCase();
                const mainRows = document.querySelectorAll('.expandable-row');

                mainRows.forEach(row => {
                    const regressionName = row.querySelector('.fixed-first-col').textContent.toLowerCase();
                    const isVisible = regressionName.includes(filter);

                    if (isVisible) {
                        row.style.display = ''; // Show the row
                    } else {
                        row.style.display = 'none'; // Hide the row
                        // Also hide any expanded sub-rows and MD rows if the parent is hidden
                        const expandBtn = row.querySelector('.expand-btn');
                        if (expandBtn && expandBtn.classList.contains('expanded')) {
                            toggleRow(row.id); // Collapse if expanded
                        }
                    }
                });
                // After filtering main rows, re-apply sub-row filter to ensure consistency
                if (searchSubRowInput) {
                    const event = new Event('keyup');
                    searchSubRowInput.dispatchEvent(event);
                }
            });

            // NEW EVENT LISTENER FOR SUB-ROW SEARCH
            searchSubRowInput?.addEventListener('keyup', function() {
                const filter = this.value.toLowerCase();
                const subRows = document.querySelectorAll('.sub-row');

                subRows.forEach(row => {
                    const subRowName = row.querySelector('.fixed-first-col').textContent.toLowerCase();
                    const isVisibleBySearch = subRowName.includes(filter);

                    // Check if the row is already hidden by the "hide zero fails" filter
                    const isFilteredOutByFails = row.classList.contains('filtered-out');

                    // Get the associated MD row
                    const mdRow = document.querySelector(`tr[data-parent="${row.id}"]`);

                    if (isVisibleBySearch && !isFilteredOutByFails) {
                        row.style.display = ''; // Show the sub-row
                        if (mdRow) mdRow.style.display = ''; // Show its MD row (actual visibility depends on toggleRow)

                        // Ensure its parent (main row) is visible if it's not already
                        const parentId = row.dataset.parent;
                        if (parentId) {
                            const parentRow = document.getElementById(parentId);
                            if (parentRow) {
                                // Only make parent visible if it also matches the main search filter
                                const mainSearchFilter = searchInput.value.toLowerCase();
                                const mainRegressionName = parentRow.querySelector('.fixed-first-col').textContent.toLowerCase();
                                if (mainRegressionName.includes(mainSearchFilter)) {
                                    parentRow.style.display = '';
                                }
                            }
                        }
                    } else {
                        row.style.display = 'none'; // Hide the sub-row
                        if (mdRow) mdRow.style.display = 'none'; // Hide its MD row
                    }
                });

                // After filtering sub-rows, re-evaluate visibility of main rows
                // A main row should be visible if any of its *currently visible* sub-rows are visible
                // AND it matches the main search filter.
                const mainSearchFilter = searchInput.value.toLowerCase();
                const mainRows = document.querySelectorAll('.expandable-row');
                mainRows.forEach(mainRow => {
                    const hasVisibleChildren = Array.from(document.querySelectorAll(`tr[data-parent="${mainRow.id}"]`))
                                                    .some(childRow => childRow.style.display !== 'none');
                    const mainRegressionName = mainRow.querySelector('.fixed-first-col').textContent.toLowerCase();
                    const mainMatchesFilter = mainRegressionName.includes(mainSearchFilter);

                    if (hasVisibleChildren && mainMatchesFilter) {
                        mainRow.style.display = '';
                    } else {
                        mainRow.style.display = 'none';
                        // Collapse if hidden
                        const expandBtn = mainRow.querySelector('.expand-btn');
                        if (expandBtn && expandBtn.classList.contains('expanded')) {
                            toggleRow(mainRow.id);
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
